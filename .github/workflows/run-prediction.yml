name: Run V6 Stable Prediction

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Optional target issue"
        required: false
        type: string
      start_issue:
        description: "Backfill from this issue (default 2026197)"
        required: false
        default: "2026197"
        type: string
      force:
        description: "Overwrite an existing prediction"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Validate only; do not write files"
        required: false
        default: false
        type: boolean
      refresh_data:
        description: "Fetch and validate the latest draw data before prediction"
        required: false
        default: true
        type: boolean
      retry_attempt:
        description: "Internal retry marker"
        required: false
        default: "0"
        type: string
  # Draw data is refreshed around 21:40 China time; cron expressions use UTC.
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
    # Mobile ledger checks for an explicit V6 run request every 15 minutes.
    - cron: "7,22,37,52 * * * *"

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: v6-stable-prediction-generation
  cancel-in-progress: false

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Check primary run or failed-run retry
        id: decide
        shell: pwsh
        run: |
          $eventName = '${{ github.event_name }}'
          $schedule = '${{ github.event.schedule }}'
          $shouldRun = $eventName -eq 'workflow_dispatch' -or $schedule -eq '0 14 * * *'
          if ($schedule -eq '0 15 * * *') {
            try {
              $headers = @{
                Authorization = "Bearer $env:GITHUB_TOKEN"
                Accept = 'application/vnd.github+json'
                'X-GitHub-Api-Version' = '2022-11-28'
              }
              $uri = 'https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-prediction.yml/runs?event=schedule&per_page=20'
              $runs = (Invoke-RestMethod -Uri $uri -Headers $headers).workflow_runs
              $windowStart = [DateTimeOffset]::UtcNow.Date.AddHours(13.5)
              $currentRunId = [long]'${{ github.run_id }}'
              $primary = $runs |
                Where-Object {
                  [long]$_.id -ne $currentRunId -and
                  [DateTimeOffset]::Parse($_.run_started_at) -ge $windowStart -and
                  [DateTimeOffset]::Parse($_.run_started_at) -lt [DateTimeOffset]::UtcNow
                } |
                Sort-Object { [DateTimeOffset]::Parse($_.run_started_at) } -Descending |
                Select-Object -First 1
              $shouldRun = $null -eq $primary -or $primary.conclusion -ne 'success'
              if ($null -ne $primary) {
                Write-Host "22:00 run $($primary.id) conclusion: $($primary.conclusion)"
              } else {
                Write-Host 'No 22:00 run found; enabling the 23:00 retry.'
              }
            } catch {
              Write-Warning "Could not inspect the 22:00 run; enabling the safe retry: $($_.Exception.Message)"
              $shouldRun = $true
            }
          } elseif ($schedule -eq '7,22,37,52 * * * *') {
            try {
              $tokenUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=smart-ledger-v6"
              $oidc = (Invoke-RestMethod -Uri $tokenUrl -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }).value
              $headers = @{ Authorization = "Bearer $oidc" }
              $response = Invoke-RestMethod -Uri 'https://smart-ledger-2026.ntr133.chatgpt.site/api/v6-sync/request' -Headers $headers
              $shouldRun = [bool]$response.run_requested
            } catch {
              Write-Warning "Mobile trigger check failed: $($_.Exception.Message)"
              $shouldRun = $false
            }
          }
          "should_run=$($shouldRun.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ github.token }}

  predict:
    needs: check-trigger
    if: ${{ needs.check-trigger.outputs.should_run == 'true' }}
    runs-on: windows-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore PredictionRunner/PredictionRunner.csproj

      - name: Build prediction runner
        run: dotnet build PredictionRunner/PredictionRunner.csproj --configuration Release --no-restore

      - name: Rebuild history database from committed JSON
        shell: pwsh
        run: |
          dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- --rebuild-db --rebuild-only

      - name: Refresh latest draw data
        if: ${{ github.event_name == 'schedule' || inputs.refresh_data == true }}
        shell: pwsh
        run: |
          $arguments = @('--refresh-data', '--refresh-only')
          if ('${{ github.event_name }}' -eq 'schedule') { $arguments += '--require-advance' }
          if ('${{ inputs.dry_run }}' -eq 'true') { $arguments += '--dry-run' }
          dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- @arguments

      - name: Validate historical data
        shell: pwsh
        run: |
          $arguments = @('--dry-run', '--generate-all')
          if ('${{ inputs.issue }}') { $arguments += @('--issue', '${{ inputs.issue }}') }
          $startIssue = '${{ inputs.start_issue }}'
          if (!$startIssue) { $startIssue = '2026197' }
          $arguments += @('--start-issue', $startIssue)
          dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- @arguments

      - name: Generate prediction
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        run: |
          $arguments = @('--generate-all')
          if ('${{ inputs.issue }}') { $arguments += @('--issue', '${{ inputs.issue }}') }
          $startIssue = '${{ inputs.start_issue }}'
          if (!$startIssue) { $startIssue = '2026197' }
          $arguments += @('--start-issue', $startIssue)
          if ('${{ inputs.force }}' -eq 'true') { $arguments += '--force' }
          dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- @arguments

      - name: Run tests
        run: dotnet run --project Tests/六合分析软件.SmokeTests.csproj --configuration Release

      - name: Commit generated files
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/history.json site/data/predictions site/data/daily-records site/data/runtime-state.json
          if (git diff --cached --quiet) {
            Write-Host "No prediction changes to commit."
            exit 0
          }
          $issue = (Get-Content site/data/predictions/latest.json | ConvertFrom-Json).latest_issue
          git commit -m "chore: update V6 stable prediction for issue $issue"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload history database artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: v6-history-db
          path: data/history.db
          if-no-files-found: error
          retention-days: 30

      - name: Publish V6 data to smart ledger
        shell: pwsh
        run: |
          function Invoke-RequiredPublish {
            param([string]$Url, [hashtable]$Headers, [string]$Body)
            $lastError = $null
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                $response = Invoke-RestMethod -Method Post -Uri $Url -Headers $Headers -ContentType 'application/json' -Body $Body -ErrorAction Stop
                if ($null -ne $response.status -and $response.status -ne 'success') {
                  throw "发布接口返回异常状态：$($response.status)"
                }
                return $response
              } catch {
                $lastError = $_
                if ($attempt -lt 3) { Start-Sleep -Seconds (3 * $attempt) }
              }
            }
            throw "发布失败：$($lastError.Exception.Message)"
          }

          $manifest = Get-Content 'site/data/daily-records/manifest.json' -Raw | ConvertFrom-Json
          $predictions = @{}
          foreach ($file in $manifest.records) {
            $predictions[$file] = Get-Content "site/data/daily-records/$file" -Raw | ConvertFrom-Json
          }
          $payload = @{
            history = Get-Content 'site/data/history.json' -Raw | ConvertFrom-Json
            dailyHistory = Get-Content 'site/data/daily-records/history.json' -Raw | ConvertFrom-Json
            manifest = $manifest
            modelState = Get-Content 'site/data/runtime-state.json' -Raw | ConvertFrom-Json
            predictions = $predictions
          } | ConvertTo-Json -Depth 100 -Compress
          $tokenUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=smart-ledger-v6"
          $oidc = (Invoke-RestMethod -Uri $tokenUrl -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" } -ErrorAction Stop).value
          $headers = @{ Authorization = "Bearer $oidc" }

          Invoke-RequiredPublish -Url 'https://smart-ledger-2026.ntr133.chatgpt.site/api/v6-sync/publish' -Headers $headers -Body $payload | Out-Host
          $publishedManifest = Invoke-RestMethod -Uri 'https://smart-ledger-2026.ntr133.chatgpt.site/api/v6-sync/manifest' -ErrorAction Stop
          $expected = @($manifest.records | ForEach-Object { [string]$_ } | Sort-Object { [int]($_ -replace '\.json$', '') } -Descending)
          $actual = @($publishedManifest.records | ForEach-Object { [string]$_ })
          foreach ($file in $expected) {
            if ($actual -notcontains $file) { throw "发布校验失败：缺少 $file" }
          }
          $latestFile = $expected | Select-Object -First 1
          if ($latestFile) {
            Invoke-RestMethod -Uri "https://smart-ledger-2026.ntr133.chatgpt.site/api/v6-sync/prediction?file=$latestFile" -ErrorAction Stop | Out-Null
          }

          try {
            Invoke-RequiredPublish -Url 'https://v6-sync-ingress-2026.ntr133.chatgpt.site/api/sync/publish' -Headers $headers -Body $payload | Out-Host
          } catch {
            Write-Warning "外部同步暂时不可用；智能账本已完成本地发布：$($_.Exception.Message)"
          }

  retry-on-failure:
    needs: [check-trigger, predict]
    if: ${{ always() && needs.check-trigger.outputs.should_run == 'true' && needs.predict.result == 'failure' && inputs.retry_attempt != '1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Queue one guarded retry
        shell: pwsh
        run: |
          $startIssue = '${{ inputs.start_issue }}'
          if (!$startIssue) { $startIssue = '2026197' }
          $body = @{
            ref = '${{ github.ref_name }}'
            inputs = @{
              issue = '${{ inputs.issue }}'
              start_issue = $startIssue
              force = '${{ inputs.force }}'
              dry_run = 'false'
              refresh_data = 'true'
              retry_attempt = '1'
            }
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-prediction.yml/dispatches' -Headers @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          } -ContentType 'application/json' -Body $body -ErrorAction Stop
        env:
          GITHUB_TOKEN: ${{ github.token }}
